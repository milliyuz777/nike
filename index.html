<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fayl konvertor</title>
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#f5f6f8;--tx:#111418;--mut:#667085;--bd:#e4e7ec;--ac:#4f46e5;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000000;--card:#111214;--tx:#f2f4f7;--mut:#98a2b3;--bd:#23262b;--ac:#818cf8;--acx:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .4s,color .4s}
main{max-width:620px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 20px}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;background:var(--card);cursor:pointer}
.drop{display:block;border:2px dashed var(--bd);background:var(--card);border-radius:18px;padding:34px 16px;text-align:center;cursor:pointer;transition:border-color .2s}
.drop.on{border-color:var(--ac)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.drop span{color:var(--mut);font-size:14px}
input[type=file]{display:none}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.top{display:flex;gap:12px;align-items:center}
.top img{width:52px;height:52px;object-fit:cover;border-radius:10px;background:var(--bd)}
.nm{flex:1;min-width:0}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nm small{color:var(--mut)}
.act{display:flex;gap:8px;margin-top:10px}
select,button,a.btn{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
select{flex:1}
button.p,a.btn.p{background:var(--ac);color:var(--acx);border:0;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
button.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:4px 8px}
.msg{font-size:13px;color:var(--mut);margin-top:8px}
.rate{margin-top:34px;text-align:center;border-top:1px solid var(--bd);padding-top:24px}
.rate h2{font-size:16px;margin:0 0 10px}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;border:0;font-size:34px;line-height:1;cursor:pointer;color:var(--bd);padding:2px}
.stars button.f{color:#f5b301}
.rate p{color:var(--mut);font-size:14px;margin:10px 0}
.rate a.btn{display:inline-block;margin-top:4px}
.rate a.btn[hidden]{display:none}
.rate input{width:100%;max-width:320px;margin-bottom:12px;text-align:center;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.admin main>:not(#adm):not(header){display:none}
.admin #adm{display:block}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2 b{display:block;font-size:15px}.row2 small{color:var(--mut)}
.st{color:#f5b301;letter-spacing:2px;white-space:nowrap}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.big div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.big small{color:var(--mut);display:block;font-size:12px}.big b{font-size:24px}
</style>
</head>
<body>
<main>
<header><h1>Fayl konvertor</h1><button class="tag" id="mode" type="button"></button></header>
<p class="sub">Faylni yuklang, formatni tanlang va yuklab oling. Fayllar qurilmangizdan chiqmaydi.</p>

<label class="drop" id="drop" for="file"><b>Fayllarni shu yerga tashlang</b><span>yoki bosib tanlang (PNG, JPG, WEBP, BMP, GIF, SVG)</span></label>
<input type="file" id="file" multiple accept="image/*,.svg">
<div id="items"></div>

<section class="rate">
<h2>Xizmatni baholang</h2>
<input id="nm" maxlength="30" placeholder="Ismingizni kiriting" autocomplete="name">
<div class="stars" id="stars"></div>
<p id="rmsg"></p>
</section>
<div id="adm" hidden></div>
</main>
<script>

function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* Vaqtga qarab mavzu: 06:00–18:00 oq, 18:00–06:00 qora */
var man=null;try{man=localStorage.getItem("konv.theme")}catch(e){}
function theme(){var h=new Date().getHours(),d=man?man=="dark":(h>=18||h<6);document.documentElement.setAttribute("data-theme",d?"dark":"light");$("mode").textContent=d?"☾ Tungi rejim":"☀ Kunduzgi rejim"}
$("mode").onclick=function(){var d=document.documentElement.getAttribute("data-theme")=="dark";man=d?"light":"dark";try{localStorage.setItem("konv.theme",man)}catch(e){}theme()};
theme();setInterval(theme,60000);

/* Konvertatsiya */
var FM={png:["PNG","image/png"],jpg:["JPG","image/jpeg"],webp:["WEBP","image/webp"],svg:["SVG","image/svg+xml"]};
var items=[];
function rd(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=no;r.readAsDataURL(f)})}
function ld(u){return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i)};i.onerror=no;i.src=u})}
function cv(img){var c=document.createElement("canvas");c.width=img.naturalWidth||img.width||512;c.height=img.naturalHeight||img.height||512;return c}
function blob(c,t){return new Promise(function(ok){c.toBlob(ok,t,.92)})}
async function conv(it,fmt){
 var img=await ld(it.url),c=cv(img),x=c.getContext("2d");
 if(fmt=="svg"){
  if(!window.ImageTracer)throw new Error("SVG kutubxonasi yuklanmadi");
  x.drawImage(img,0,0);
  var s=ImageTracer.imagedataToSVG(x.getImageData(0,0,c.width,c.height),{numberofcolors:16,scale:1});
  return new Blob([s],{type:"image/svg+xml"});
 }
 if(fmt=="jpg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}
 x.drawImage(img,0,0);
 return blob(c,FM[fmt][1]);
}
function draw(){
 $("items").innerHTML=items.map(function(it,i){
  var opts=Object.keys(FM).map(function(k){return '<option value="'+k+'"'+(k==it.fmt?" selected":"")+'>'+FM[k][0]+'</option>'}).join("");
  return '<div class="item"><div class="top"><img src="'+it.url+'" alt=""><div class="nm"><b>'+esc(it.name)+'</b><small>'+Math.round(it.size/1024)+' KB</small></div><button class="x" data-d="'+i+'">×</button></div>'+
  '<div class="act"><select data-s="'+i+'">'+opts+'</select><button class="p" data-c="'+i+'">Oʻtkazish</button></div><div class="msg" id="m'+i+'">'+(it.msg||"")+'</div></div>';
 }).join("");
}
$("items").onclick=async function(e){
 var d=e.target.getAttribute("data-d"),c=e.target.getAttribute("data-c");
 if(d!==null){items.splice(+d,1);draw();return}
 if(c!==null){
  var it=items[+c],m=$("m"+c);m.textContent="Oʻtkazilmoqda…";
  try{
   var b=await conv(it,it.fmt),n=it.name.replace(/\.[^.]+$/,"")+"."+it.fmt,dl=null;
   try{dl=window.claude?await window.claude.use("downloads"):null}catch(x){}
   if(dl){await dl.save({filename:n,data:b})}
   else{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}
   m.textContent="Tayyor va yuklab olindi: "+n+" ("+Math.round(b.size/1024)+" KB)";it.msg=m.textContent;
  }catch(err){m.textContent=err&&err.code=="declined"?"Yuklab olish bekor qilindi":"Xatolik: "+((err&&err.message)||err)}
 }
};
$("items").onchange=function(e){var s=e.target.getAttribute("data-s");if(s!==null)items[+s].fmt=e.target.value};
async function add(files){
 files=Array.from(files);
 for(var f of files){
  if(!/^image\//.test(f.type)&&!/\.svg$/i.test(f.name))continue;
  var u=await rd(f);
  var ext=(f.name.split(".").pop()||"").toLowerCase();
  items.push({name:f.name,size:f.size,url:u,fmt:ext=="png"?"jpg":"png",msg:""});
 }
 draw();
}
$("file").onchange=function(e){add(e.target.files);e.target.value=""};
["dragover","drop"].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault()})});
var dr=$("drop");
["dragover","dragenter"].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.add("on")})});
["dragleave","drop"].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.remove("on")})});
dr.addEventListener("drop",function(e){add(e.dataTransfer.files)});

/* Baholash */
var R=0,DB=null,UID=null,USER=null;
function stars(){$("stars").innerHTML=[1,2,3,4,5].map(function(n){return '<button data-r="'+n+'" class="'+(n<=R?"f":"")+'" aria-label="'+n+' yulduz">★</button>'}).join("")}
function msg(t){$("rmsg").textContent=t}
stars();msg("Baholang");
$("nm").oninput=function(){if(!R)msg("Baholang")};
$("stars").onclick=async function(e){
 var r=e.target.getAttribute("data-r");if(!r)return;
 var name=$("nm").value.trim();
 if(!name){msg("Avval ismingizni kiriting");$("nm").focus();return}
 if(!DB){msg("Baho yuborish uchun tizimga kiring");return}
 R=+r;stars();msg("Yuborilmoqda…");
 try{
  await DB.collection("ratings").doc(UID).set({name:name.slice(0,30),stars:R,at:Date.now()});
  msg("Rahmat, "+name+"! Bahoyingiz: "+R+" / 5");
 }catch(err){R=0;stars();msg("Baho yuborilmadi: "+((err&&err.message)||err))}
};

/* Egasi uchun baholar sahifasi: sayt havolasi + #baholar */
var ADMIN=location.hash=="#baholar";
if(ADMIN){document.body.classList.add("admin");$("adm").innerHTML='<p class="sub">Yuklanmoqda…</p>'}
function admin(){
 var box=$("adm");
 if(!(USER&&DB&&USER.isOwner())){box.innerHTML='<p class="sub">Bu sahifa faqat sayt egasi uchun.</p>';return}
 DB.collection("ratings").orderBy("at","desc").onSnapshot(function(sn){
  var rows=sn.docs.map(function(x){return x.data()}),sum=0;
  rows.forEach(function(r){sum+=+r.stars||0});
  var avg=rows.length?(sum/rows.length).toFixed(2):"0";
  box.innerHTML='<p class="sub">Kim qancha baho bergani</p><div class="big"><div><small>Oʻrtacha baho</small><b>'+avg+' / 5</b></div><div><small>Jami baho</small><b>'+rows.length+'</b></div></div>'+
  (rows.length?rows.map(function(r){var n=Math.max(0,Math.min(5,+r.stars||0));return '<div class="item row2"><div><b>'+esc(r.name||"Nomaʼlum")+'</b><small>'+new Date(r.at).toLocaleString("uz-UZ")+'</small></div><span class="st">'+"★".repeat(n)+'<span style="color:var(--bd)">'+"★".repeat(5-n)+'</span></span></div>'}).join(""):'<div class="item msg">Hali baho yoʻq</div>');
 },function(){box.innerHTML='<p class="sub">Baholarni oʻqib boʻlmadi.</p>'});
}
(async function(){
 try{
  if(window.claude){
   var u=await window.claude.use("user"),d=await window.claude.use("db");
   if(u&&d){USER=u;DB=d;UID=await u.id()}
  }
 }catch(e){}
 if(ADMIN)admin();
})();
</script>
</body>
</html>
